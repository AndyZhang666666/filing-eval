name: Validate evidence replay
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build-demo.mjs
      - run: node scripts/verify-demo.mjs
      - run: node --test scripts/test-review.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: filing-evidence-demo
          path: demo
